; PlatformIO project configuration for the tracked vehicle controller.
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3

; ---------------------------------------------------------------------------
; Firmware for the ESP32-S3-N16R8 (16 MB QIO flash, 8 MB octal PSRAM)
; ---------------------------------------------------------------------------
[env:esp32s3]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 memory layout
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    ; Uncomment if you plug the board in via the native "USB" port instead of
    ; the "COM"/"UART" port and want Serial output on that port:
    ; -DARDUINO_USB_MODE=1
    ; -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    ESP32Async/AsyncTCP @ ^3.3.2
    ESP32Async/ESPAsyncWebServer @ ^3.6.0

; ---------------------------------------------------------------------------
; Host-side unit tests for the hardware independent logic (lib/DriveCore).
; Run with:  pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
